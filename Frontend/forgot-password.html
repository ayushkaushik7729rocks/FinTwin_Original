<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Reset password — FinTwin
    </title>

    <link
        rel="stylesheet"
        href="global.css"
    >
</head>

<body data-auth="forgot">

    <!-- ========================================
         AUTHENTICATION PAGE
         ======================================== -->

    <main class="auth">

        <!-- ====================================
             BRANDING / INTRODUCTION
             ==================================== -->

        <section class="auth-side">

            <a
                class="brand"
                href="../index.html"
            >
                Fin<b>Twin</b>
            </a>

            <h1>
                Back to
                <br>

                <span class="gradient">
                    your future.
                </span>
            </h1>

        </section>


        <!-- ====================================
             RESET PASSWORD FORM
             ==================================== -->

        <section class="auth-form">

            <div>

                <a
                    class="brand"
                    href="../index.html"
                >
                    Fin<b>Twin</b>
                </a>

                <h2>
                    Reset password
                </h2>

                <p class="muted">
                    We'll send reset instructions to your email.
                </p>


                <form id="authForm">

                    <!-- Email -->

                    <label class="field">
                        Email

                        <input
                            class="input"
                            type="email"
                            required
                            placeholder="you@example.com"
                        >
                    </label>


                    <!-- Submit -->

                    <button class="btn">
                        Send Reset Link
                    </button>


                    <!-- Back to Login -->

                    <a
                        class="muted"
                        href="login.html"
                    >
                        ← Back to Log In
                    </a>

                </form>

            </div>

        </section>

    </main>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
