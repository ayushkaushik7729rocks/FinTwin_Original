<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Sign up — FinTwin
    </title>

    <link
        rel="stylesheet"
        href="global.css"
    >
</head>

<body data-auth="signup">

    <!-- ========================================
         AUTHENTICATION PAGE
         ======================================== -->

    <main class="auth">

        <!-- ====================================
             BRANDING / INTRODUCTION
             ==================================== -->

        <section class="auth-side">

            <a
                class="brand"
                href="../index.html"
            >
                Fin<b>Twin</b>
            </a>

            <h1>
                Build your
                <br>

                <span class="gradient">
                    financial twin.
                </span>
            </h1>

            <p>
                One intelligent model for every goal,
                tradeoff, and decision.
            </p>

        </section>


        <!-- ====================================
             SIGN UP FORM
             ==================================== -->

        <section class="auth-form">

            <div>

                <a
                    class="brand"
                    href="../index.html"
                >
                    Fin<b>Twin</b>
                </a>

                <h2>
                    Create your account
                </h2>

                <p class="muted">
                    Your future starts with a clearer picture today.
                </p>


                <form id="authForm">

                    <!-- Full Name -->

                    <label class="field">
                        Full Name

                        <input
                            class="input"
                            name="name"
                            required
                        >
                    </label>


                    <!-- Email -->

                    <label class="field">
                        Email

                        <input
                            class="input"
                            name="email"
                            type="email"
                            required
                        >
                    </label>


                    <!-- Password -->

                    <label class="field">
                        Password

                        <input
                            class="input"
                            id="password"
                            name="password"
                            type="password"
                            required
                        >

                        <button
                            class="btn secondary toggle"
                            id="togglePassword"
                            type="button"
                        >
                            Show
                        </button>

                        <span class="strength">
                            <i></i>
                        </span>

                    </label>


                    <!-- Confirm Password -->

                    <label class="field">
                        Confirm Password

                        <input
                            class="input"
                            name="confirm"
                            type="password"
                            required
                        >
                    </label>


                    <!-- Error Message -->

                    <p
                        id="error"
                        class="form-error"
                    ></p>


                    <!-- Submit -->

                    <button class="btn">
                        Create My Financial Twin
                    </button>


                    <!-- Login Link -->

                    <p class="muted">
                        Already have an account?

                        <a
                            class="positive"
                            href="login.html"
                        >
                            Log In
                        </a>
                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
